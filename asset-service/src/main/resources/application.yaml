server:
  port: 8081

spring:
  application:
    name: asset-service

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

# Optional: for debugging / actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
